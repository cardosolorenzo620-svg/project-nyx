<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080a10"><title>NYX — Les Cendres du Réel</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#080a10;color:#eee;font-family:system-ui,sans-serif;overflow:hidden}#game{width:100vw;height:100dvh;position:relative;touch-action:none}canvas{display:block;width:100%;height:100%;background:#0b1018}#ui{position:absolute;inset:0;pointer-events:none}.top{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;justify-content:space-between}.panel{background:#090d16dd;border:1px solid #ffffff18;border-radius:14px;padding:9px 11px;backdrop-filter:blur(8px)}.bars{width:130px}.bar{height:7px;background:#ffffff14;border-radius:8px;margin-top:4px;overflow:hidden}.hp{height:100%;background:#ef6680}.will{height:100%;background:#65d9e8}.hint{position:absolute;top:82px;left:50%;transform:translateX(-50%);text-align:center;max-width:90%;font-size:13px;color:#cbd3e8}.dialog{position:absolute;left:10px;right:10px;bottom:16px;background:#0c111ddd;border:1px solid #ffffff20;border-radius:18px;padding:15px;pointer-events:auto}.name{color:#72e4f4;font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.12em}.text{font-size:16px;line-height:1.45;margin:6px 0 12px}.choices{display:grid;gap:8px}.choice{border:1px solid #ffffff18;background:#171e2d;color:#fff;border-radius:12px;padding:12px;text-align:left;font-weight:750}.choice:active{transform:scale(.98)}.touch{position:absolute;bottom:18px;left:18px;width:150px;height:150px;pointer-events:auto}.pad{position:absolute;width:52px;height:52px;border-radius:16px;background:#ffffff10;border:1px solid #ffffff18;color:#fff;font-size:23px}.up{left:49px;top:0}.down{left:49px;bottom:0}.left{left:0;top:49px}.right{right:0;top:49px}.action{position:absolute;right:22px;bottom:42px;width:74px;height:74px;border-radius:50%;border:1px solid #ffffff25;background:#7c5cffcc;color:#fff;font-weight:900;font-size:15px;pointer-events:auto}.inv{position:absolute;right:12px;top:78px;max-width:180px;font-size:11px;text-align:right}.hidden{display:none}.title{position:absolute;inset:0;background:radial-gradient(circle,#1d2540,#080a10 65%);display:grid;place-items:center;text-align:center;padding:24px;pointer-events:auto}.title h1{font-size:clamp(55px,18vw,100px);margin:0;letter-spacing:.12em;text-shadow:0 0 35px #9276ff88}.title p{max-width:430px;color:#bbc3d8;line-height:1.5}.start{padding:15px 24px;border:0;border-radius:14px;background:linear-gradient(135deg,#7558ee,#45a7b9);color:#fff;font-weight:900;font-size:16px}
</style></head><body><div id="game"><canvas id="c"></canvas><div id="ui"></div><div id="title" class="title"><div><div style="letter-spacing:.2em;color:#72e4f4;font-weight:900">UNE EXPÉRIENCE NYX</div><h1>NYX</h1><h2>LES CENDRES DU RÉEL</h2><p>Une aventure d'exploration, de mystère et de choix. Cette fois, tu ne regardes pas une histoire : <b>tu la traverses.</b></p><button class="start" onclick="start()">COMMENCER</button></div></div></div>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d'),ui=document.getElementById('ui');let W,H,run=false,last=0,keys={},dialog=null;
let p={x:500,y:390,hp:10,will:5};let cam={x:0,y:0};let items=[],flags={};let npcs=[{x:300,y:250,name:'Mara',color:'#e89bff',talk:0},{x:760,y:280,name:'Le Veilleur',color:'#7ee7f4',talk:0}];
let world={w:1500,h:900};let walls=[{x:0,y:0,w:1500,h:35},{x:0,y:865,w:1500,h:35},{x:0,y:0,w:35,h:900},{x:1465,y:0,w:35,h:900},{x:170,y:130,w:280,h:35},{x:170,y:130,w:35,h:260},{x:700,y:120,w:35,h:280},{x:700,y:365,w:300,h:35},{x:1040,y:520,w:35,h:250},{x:1040,y:735,w:300,h:35}];
let doors=[{x:570,y:120,w:70,h:35,name:'Porte noire',open:false},{x:1000,y:330,w:35,h:70,name:'Porte 13',open:false}];
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}addEventListener('resize',resize);resize();
function start(){let t=document.getElementById('title');if(t)t.remove();run=true;last=performance.now();requestAnimationFrame(loop)}
function save(){localStorage.setItem('nyx-game',JSON.stringify({p,items,flags,doors:doors.map(d=>({open:d.open})),npcs:npcs.map(n=>({talk:n.talk}))}))}function resetGame(){if(confirm('Effacer la sauvegarde et recommencer ?')){localStorage.removeItem('nyx-game');location.reload()}}function load(){try{let s=JSON.parse(localStorage.getItem('nyx-game'));if(s){p=Object.assign(p,s.p||{});items=Array.isArray(s.items)?s.items:[];flags=s.flags||{};if(Array.isArray(s.doors))s.doors.forEach((x,i)=>{if(doors[i])doors[i].open=!!x.open});if(Array.isArray(s.npcs))s.npcs.forEach((x,i)=>{if(npcs[i])npcs[i].talk=!!x.talk})}}catch(e){localStorage.removeItem('nyx-game')}}
load();
function near(a,b,d=70){return Math.hypot(a.x-b.x,a.y-b.y)<d}
function interact(){if(dialog)return;
let n=npcs.find(n=>near(p,n,75));if(n){dialog={name:n.name,text:n.name==='Mara'?(n.talk?'« Tu as déjà la réponse. Regarde derrière toi.':'« Tu es arrivé. Le bâtiment change quand quelqu’un le remarque. »'):'« La porte 13 ne s’ouvre pas avec une clé. Elle s’ouvre avec un souvenir. »',choices:[{t:'Répondre',f:()=>{n.talk=1;flags.mara=true;dialog=null;save()}},{t:'Partir',f:()=>dialog=null}]};return}
let d=doors.find(d=>near(p,{x:d.x+d.w/2,y:d.y+d.h/2},80));if(d){if(d.name==='Porte noire'&&!d.open){d.open=true;flags.blackdoor=true;dialog={name:'Porte noire',text:'Le verrou cède. Derrière : une salle qui ne devrait pas exister.',choices:[{t:'Entrer',f:()=>{p.x=640;p.y=210;dialog=null}},{t:'Refermer',f:()=>dialog=null}]}}else if(d.name==='Porte 13'&&!d.open){if(flags.memory){d.open=true;dialog={name:'Porte 13',text:'La porte reconnaît ton souvenir.',choices:[{t:'Entrer',f:()=>{p.x=930;p.y=350;dialog=null;flags.sanctum=true}},{t:'Attendre',f:()=>dialog=null}]}}else{dialog={name:'Porte 13',text:'Elle murmure : « Souviens-toi de ce que tu as perdu. »',choices:[{t:'Chercher la réponse',f:()=>{flags.memory=true;dialog=null;save()}},{t:'Partir',f:()=>dialog=null}]}}}return}
if(Math.hypot(p.x-1250,p.y-610)<75&&!flags.core){flags.core=true;items.push('Fragment du Réel');dialog={name:'Fragment',text:'Un éclat de verre flotte dans l’air. Tu le touches. Une seconde de ta vie disparaît.',choices:[{t:'Continuer',f:()=>dialog=null}]};save()}
}
function move(dt){let sp=190*dt,dx=0,dy=0;if(keys.up)dy--;if(keys.down)dy++;if(keys.left)dx--;if(keys.right)dx++;if(dx&&dy){dx*=.707;dy*=.707}let nx=p.x+dx*sp,ny=p.y+dy*sp;if(!hit(nx,p.y))p.x=nx;if(!hit(p.x,ny))p.y=ny;cam.x=Math.max(0,Math.min(world.w-W,p.x-W/2));cam.y=Math.max(0,Math.min(world.h-H,p.y-H/2))}
function hit(x,y){let r=18;return walls.some(a=>x+r>a.x&&x-r<a.x+a.w&&y+r>a.y&&y-r<a.y+a.h)||doors.some(d=>!d.open&&x+r>d.x&&x-r<d.x+d.w&&y+r>d.y&&y-r<d.y+d.h)}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(-cam.x,-cam.y);
ctx.fillStyle='#101722';ctx.fillRect(0,0,world.w,world.h);ctx.strokeStyle='#182333';for(let x=0;x<world.w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}for(let y=0;y<world.h;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}
walls.forEach(a=>{ctx.fillStyle='#252d3b';ctx.fillRect(a.x,a.y,a.w,a.h)});doors.forEach(d=>{ctx.fillStyle=d.open?'#386b68':'#6b3e66';ctx.fillRect(d.x,d.y,d.w,d.h)});
ctx.fillStyle='#1c2738';ctx.fillRect(90,70,450,500);ctx.fillStyle='#182b31';ctx.fillRect(1080,470,330,300);ctx.fillStyle='#28334a';ctx.font='bold 18px system-ui';ctx.fillText('MAISON',220,110);ctx.fillText('ARCHIVES',1110,510);ctx.fillText('PORTE 13',900,315);
npcs.forEach(n=>{ctx.fillStyle=n.color;ctx.beginPath();ctx.arc(n.x,n.y,18,0,7);ctx.fill();ctx.fillStyle='#dce6ff';ctx.font='12px system-ui';ctx.fillText(n.name,n.x-25,n.y-27)});
if(!flags.core){ctx.fillStyle='#a78bfa';ctx.shadowBlur=25;ctx.shadowColor='#a78bfa';ctx.beginPath();ctx.arc(1250,610,13,0,7);ctx.fill();ctx.shadowBlur=0}
ctx.fillStyle='#72e4f4';ctx.beginPath();ctx.arc(p.x,p.y,19,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x-5,p.y-3,3,0,7);ctx.arc(p.x+5,p.y-3,3,0,7);ctx.fill();ctx.restore()}
function hud(){ui.innerHTML='<div class="top"><div class="panel bars">❤️ '+p.hp+'/10<div class="bar"><div class="hp" style="width:'+p.hp*10+'%"></div></div>🧠 '+p.will+'/5<div class="bar"><div class="will" style="width:'+p.will*20+'%"></div></div></div><div class="panel">🎒 '+(items.length?items.join(' · '):'Vide')+'</div></div><button class="panel" style="position:absolute;right:12px;top:135px;pointer-events:auto" onclick="resetGame()">🗑️ Nouvelle partie</button><div class="hint">Déplace-toi • Explore • Approche-toi des personnages et objets • ⚡ pour interagir</div><div class="touch"><button class="pad up" data-k="up">▲</button><button class="pad down" data-k="down">▼</button><button class="pad left" data-k="left">◀</button><button class="pad right" data-k="right">▶</button></div><button class="action" onclick="interact()">⚡<br>AGIR</button>'+(dialog?'<div class="dialog"><div class="name">'+dialog.name+'</div><div class="text">'+dialog.text+'</div><div class="choices">'+dialog.choices.map((c,i)=>'<button type="button" class="choice" data-choice="'+i+'">'+c.t+'</button>').join('')+'</div></div>':'')}
document.addEventListener('keydown',e=>{let k={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'}[e.key];if(k)keys[k]=true;if(e.key===' '||e.key==='e')interact()});document.addEventListener('keyup',e=>{let k={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'}[e.key];if(k)keys[k]=false});
document.addEventListener('pointerup',e=>{let b=e.target.closest&&e.target.closest('.choice');if(b&&dialog){e.preventDefault();let i=Number(b.dataset.choice);let choice=dialog.choices[i];if(choice&&typeof choice.f==='function')choice.f();}},true);ui.addEventListener('pointerdown',e=>{let b=e.target.closest('.pad');if(b){e.preventDefault();keys[b.dataset.k]=true}});ui.addEventListener('pointerup',e=>{let b=e.target.closest('.pad');if(b){e.preventDefault();keys[b.dataset.k]=false}});ui.addEventListener('pointercancel',e=>{let b=e.target.closest('.pad');if(b)keys[b.dataset.k]=false});ui.addEventListener('touchstart',e=>{let b=e.target.closest('.pad');if(b){e.preventDefault();keys[b.dataset.k]=true}},{passive:false});ui.addEventListener('touchend',e=>{let b=e.target.closest('.pad');if(b){e.preventDefault();keys[b.dataset.k]=false}},{passive:false});ui.addEventListener('touchcancel',e=>{let b=e.target.closest('.pad');if(b)keys[b.dataset.k]=false},{passive:false});
function loop(t){if(!run)return;let dt=Math.min(.04,(t-last)/1000||0);last=t;if(!dialog)move(dt);draw();hud();requestAnimationFrame(loop)}
</script></body></html>
